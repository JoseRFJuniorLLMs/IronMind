# IronMind - Thresholds de Confiança
detection:
  high_confidence: 0.90      # Retorno imediato, sem análise extra
  medium_confidence: 0.75    # Gemini Spatial analisa
  low_confidence: 0.50       # Cloud fallback (se disponível)
  minimum_display: 0.60      # Mínimo para mostrar no overlay

segmentation:
  trigger_on_defect: true    # EdgeSAM só quando detecta defeito
  iou_threshold: 0.50        # Threshold da máscara

diagnosis:
  gemini_trigger: 0.75    # Confiança abaixo disso = Gemini Spatial
  cloud_trigger: 0.50        # Confiança abaixo disso = Cloud

audio:
  yamnet_confidence: 0.70    # Mínimo para alerta de som

battery:
  full_mode: 30              # >30% = todos os modelos
  economy_mode: 20           # 20-30% = só YOLO26n
  critical_mode: 10          # <10% = só YOLOv8n (mais leve)

memory:
  gemini_timeout_seconds: 30   # Descarrega após 30s inativo
  edgesam_unload_seconds: 10     # Descarrega após 10s sem detecção
